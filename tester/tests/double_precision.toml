[config]
name = "double_precision_test"
max_ticks = 20000

[input]
source_code = """
fn main() {
	let a_hi: i32 = in();
    let a_lo: i32 = in();
    let b_hi: i32 = in();
    let b_lo: i32 = in();


    let sum_lo: i32 = a_lo + b_lo;

    let carry: i32 = 0;
    if a_lo < 0 && b_lo < 0 {
        carry = 1;
    }
    if a_lo < 0 && b_lo >= 0 && sum_lo >= 0 {
        carry = 1;
    }
    if a_lo >= 0 && b_lo < 0 && sum_lo >= 0 {
        carry = 1;
    }


    let sum_hi: i32 = a_hi + b_hi + carry;

    out(sum_hi);
    out(sum_lo);
}
"""
stream_in = [1, -1, 1, 1]

[expected]
stream_out = [3, 0]

ast = """
Program
  FunctionDecl main ()
    Body
      Let a_hi : i32
        FunctionCall in
      Let a_lo : i32
        FunctionCall in
      Let b_hi : i32
        FunctionCall in
      Let b_lo : i32
        FunctionCall in
      Let sum_lo : i32
        Add
          Variable a_lo
          Variable b_lo
      Let carry : i32
        Number 0
      If
        Cond
          And
            Less
              Variable a_lo
              Number 0
            Less
              Variable b_lo
              Number 0
        Then
          Body
            Assign carry
              Number 1
      If
        Cond
          And
            And
              Less
                Variable a_lo
                Number 0
              GreaterEq
                Variable b_lo
                Number 0
            GreaterEq
              Variable sum_lo
              Number 0
        Then
          Body
            Assign carry
              Number 1
      If
        Cond
          And
            And
              GreaterEq
                Variable a_lo
                Number 0
              Less
                Variable b_lo
                Number 0
            GreaterEq
              Variable sum_lo
              Number 0
        Then
          Body
            Assign carry
              Number 1
      Let sum_hi : i32
        Add
          Add
            Variable a_hi
            Variable b_hi
          Variable carry
      ExprStmt
        FunctionCall out
          Variable sum_hi
      ExprStmt
        FunctionCall out
          Variable sum_lo
"""

